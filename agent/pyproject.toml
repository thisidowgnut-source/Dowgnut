[project]
name = "doughnut-dev-agent"
version = "0.1.0"
description = "Development agent for the Doughnut Flava platform using Google ADK + AG-UI middleware."
requires-python = ">=3.11,<3.15"
dependencies = [
  "google-adk>=1.26,<3.0",
  "ag_ui_adk>=0.7.0,<0.8.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "litellm>=1.82.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[project.scripts]
doughnut-dev-agent = "doughnut_dev_agent.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
